        const DAY_WEATHER = {

        const COST_DATA = {
            disclaimer: "Budget tracking — costs will be filled in as bookings are confirmed",
            summary: [
                { cat: "Flights", amount: 0, note: "Emirates + AirAsia + TBD return" },
                { cat: "Hotels", amount: 0, note: "Marriott Bali + Liveaboard + Komodo hotel + KL hotel" },

        function showOverview() {
            document.getElementById('overviewView').style.display = 'block';
            document.getElementById('dayViewsContainer').innerHTML = '';
            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
        }

        function showDay(dayNum) {
            document.getElementById('overviewView').style.display = 'none';
            const container = document.getElementById('dayViewsContainer');
            const day = TRIP_DATA.days[dayNum - 1];
            container.innerHTML = renderDayView(day);
            document.querySelectorAll('.day-tab').forEach((t, i) => {
                t.classList.toggle('active', i === dayNum - 1);
            });
        }

        function renderDayView(day) {
            let html = `<div class="day-view active">`;

            // Hero
            html += `<div class="hero" style="background-image: url('${day.backgroundImage}')">
                <div class="hero-day-number">Day ${day.dayNumber}</div>
                <h2 class="hero-title">${day.title}</h2>
                <p class="hero-location">${day.location}</p>
            </div>`;

            // Flight section
            if (day.flight) {
                html += `<div class="collapsible-section section-flight">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>✈️ Flight</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>
                            <div class="info-item">
                                <div class="info-label">Flight</div>
                                <div class="info-value">${day.flight.airline}</div>
                            </div>
                            <div class="flight-info">
                                <div class="flight-endpoint">${day.flight.from}</div>
                                <div class="flight-arrow">→</div>
                                <div class="flight-endpoint">${day.flight.to}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Departure</div>
                                <div class="info-value">${day.flight.departTime}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Arrival</div>
                                <div class="info-value">${day.flight.arriveTime}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Terminal</div>
                                <div class="info-value">${day.flight.terminal}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            // Hotel section
            if (day.hotel) {
                html += `<div class="collapsible-section section-hotel">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>🏨 Hotel</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>
                            <div class="info-item">
                                <div class="info-label">Hotel</div>
                                <div class="info-value">${day.hotel.name}</div>
                                <div class="hotel-status-badge ${day.hotel.status}">${day.hotel.status}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Details</div>
                                <div class="info-value">${day.hotel.note}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Booked by</div>
                                <div class="info-value">${day.hotel.bookedBy}</div>
                            </div>
                            ${day.hotel.mapsUrl ? `<div class="info-item"><a href="https://${day.hotel.mapsUrl}" target="_blank" class="activity-maps-link">📍 View on Maps</a></div>` : ''}
                        </div>
                    </div>
                </div>`;
            }

            // Activities section
            if (day.activities && day.activities.length > 0) {
                html += `<div class="collapsible-section section-activities">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>🗺️ Activities</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>`;
                day.activities.forEach(activity => {
                    html += `<div class="activity-item">
                        <div class="activity-time">${activity.time}</div>
                        <div class="activity-text">${activity.text}${activity.needsBooking ? ' <span class="missing-status">⏳ to book</span>' : ''}</div>
                        ${activity.subNote ? `<div class="activity-note">${activity.subNote}</div>` : ''}
                    </div>`;
                });
                html += `</div></div></div>`;
            }

            // Meals section
            if (day.meals) {
                html += `<div class="collapsible-section section-meals">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>🍽️ Meals</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>`;
                ['breakfast', 'lunch', 'dinner'].forEach(meal => {
                    if (day.meals[meal]) {
                        html += `<div class="meal-section">
                            <div class="info-label">${meal.charAt(0).toUpperCase() + meal.slice(1)}</div>
                            <div class="meal-status ${day.meals[meal].status}">${day.meals[meal].status}</div>
                            ${day.meals[meal].note ? `<div class="info-value" style="margin-top:4px">${day.meals[meal].note}</div>` : ''}`;
                        if (day.meals[meal].restaurants && day.meals[meal].restaurants.length > 0) {
                            day.meals[meal].restaurants.forEach(rest => {
                                html += `<div class="restaurant-item">
                                    <div class="restaurant-name">${rest.name}</div>
                                    <div class="restaurant-desc">${rest.desc}</div>
                                    <div class="restaurant-rating">${rest.rating}</div>
                                    ${rest.mapsUrl ? `<div><a href="https://${rest.mapsUrl}" target="_blank" class="activity-maps-link">📍 View on Maps</a></div>` : ''}
                                </div>`;
                            });
                        }
                        html += `</div>`;
                    }
                });
                html += `</div></div></div>`;
            }

            // Warnings
            if (day.warnings && day.warnings.length > 0) {
                html += `<div class="collapsible-section section-warnings">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>⚠️ Warnings</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>`;
                day.warnings.forEach(w => {
                    html += `<div class="warning-item">${w}</div>`;
                });
                html += `</div></div></div>`;
            }

            // Gems
            if (day.gems && day.gems.length > 0) {
                html += `<div class="collapsible-section section-gems">
                    <div class="section-header" onclick="toggleSection(this)">
                        <h3>✨ Gems</h3>
                        <div class="chevron"></div>
                    </div>
                    <div class="section-content">
                        <div>`;
                day.gems.forEach(g => {
                    html += `<div class="gem-item">${g}</div>`;
                });
                html += `</div></div></div>`;
            }

            html += `</div>`;
            return html;
        }

        function toggleSection(header) {
            header.classList.toggle('collapsed');
            header.nextElementSibling.classList.toggle('collapsed');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function initTabs() {
            const container = document.getElementById('dayTabs');
            TRIP_DATA.days.forEach((day, i) => {
                const tab = document.createElement('button');
                tab.className = 'day-tab' + (i === 0 ? ' active' : '');
                tab.textContent = `Day ${day.dayNumber}\n${day.date.split(' ')[1]}`;
                tab.onclick = () => showDay(day.dayNumber);
                container.appendChild(tab);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
            initTabs();
            showDay(1);
        });
    </script>
